# PRODUCCION: todo el sistema en un servidor con Docker.
#   1) cp deploy/.env.production.example .env.production   y llena los valores (ver docs/DESPLIEGUE.md)
#   2) docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# El archivo docker-compose.yml de siempre sigue siendo solo para desarrollo (base de datos y Redis locales).

x-app: &app
  image: empleado-digital:latest
  build:
    context: .
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file: .env.production
  environment: &app-env
    NODE_ENV: production
    # El panel y el worker se conectan con el rol LIMITADO de la aplicacion (respeta el aislamiento entre
    # clinicas). La conexion del dueno (DATABASE_URL) solo la recibe el trabajo de migraciones.
    DATABASE_APP_URL: postgres://empleado_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base solo es alcanzable desde la red interna de Docker.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ lo exige (si Redis borra llaves, se pierden candados y trabajos).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Corre una vez al desplegar: crea extensiones, aplica migraciones y fija la contrasena del rol de la app.
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      APP_ROLE: migrate
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: web
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # Respaldo diario de la base de datos en ./backups (copialo FUERA del servidor tambien: ver docs/DESPLIEGUE.md).
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEEP_DAYS: "14"
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - ./backups:/backups
    depends_on:
      # Despues de las migraciones: si no, el primer respaldo saldria con la base vacia.
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
