services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: empleado-digital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empleado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empleado_dev}
      POSTGRES_DB: ${POSTGRES_DB:-empleado_digital}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empleado} -d ${POSTGRES_DB:-empleado_digital}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: empleado-digital-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
